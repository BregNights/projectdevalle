spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:projectdevalle}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}
    connect-timeout: 3s
    read-timeout: 5s

security:
  jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    expiration: 8h

# RF06 — sem SMTP configurado (MAIL_HOST), o conteúdo dos e-mails (inclusive o link de redefinição de senha)
# aparece no log apenas em dev.
app:
  mail:
    log-content: true
